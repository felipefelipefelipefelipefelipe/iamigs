{% extends 'base.html' %}{% block content %}<header><div><p class="eyebrow">SEU ASSISTENTE</p><h1>IAmigs IA ✦</h1><p class="muted">Pode falar comigo sobre sua adaptação à escola.</p></div></header><section class="chatbox"><div id="messages"><div class="bubble ai">Oi, {{user['name']}}! 👋<br><br>Eu sou o IAmigs. Pode me contar o que está acontecendo ou pedir uma ideia pra se adaptar melhor à escola.</div></div><form id="chatForm"><input id="msg" autocomplete="off" placeholder="Escreva sua mensagem..." required><button>Enviar</button></form></section><script>const f=document.getElementById('chatForm'),m=document.getElementById('messages'),i=document.getElementById('msg');f.onsubmit=async e=>{e.preventDefault();const t=i.value.trim();if(!t)return;m.innerHTML+=`<div class="bubble user">${t.replaceAll('&','&amp;').replaceAll('<','&lt;')}</div>`;i.value='';m.innerHTML+='<div class="bubble ai" id="typing">Pensando... ✦</div>';m.scrollTop=m.scrollHeight;const r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:t})});const d=await r.json();document.getElementById('typing').remove();m.innerHTML+=`<div class="bubble ai">${d.reply.replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('\n','<br>')}</div>`;m.scrollTop=m.scrollHeight}</script>{% endblock %}
